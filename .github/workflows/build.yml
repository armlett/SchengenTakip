name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install flet

    # HATA VEREN KISIM YERİNE BUNLARI EKLEDİK:
    # 1. Java Kurulumu (Android için şart)
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Flutter Kurulumu (Flet, arka planda Flutter kullanır)
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    # 3. APK İnşa Etme Komutu
    - name: Build APK
      run: |
        flet build apk --verbose

    # 4. Sonucu Yükle
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SchengenTracker-APK
        path: build/apk/*.apk
