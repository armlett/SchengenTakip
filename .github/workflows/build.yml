name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install flet

    - name: Build APK
      uses: flet-dev/flet-action@v0.1.0
      with:
        target: android
        # Buraya kendi ikonunun yolunu yazabilirsin, yoksa varsayılan Flet ikonu olur.
        icon: assets/icon.png 

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SchengenTracker-APK
        path: build/apk/*.apk
